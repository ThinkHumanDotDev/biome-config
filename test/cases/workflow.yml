name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ['src/**', 'package.json']

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: |
          echo "ref ${{ github.ref }}"
          pnpm test
